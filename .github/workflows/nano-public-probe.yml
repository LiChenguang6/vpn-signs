name: Nano public endpoint diagnostic
on:
  push:
    branches:
      - "diagnostics/nano-public-endpoints"
jobs:
  check-public-config:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check public Nano config safely (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, ssl, urllib.request, urllib.parse, urllib.error
          urls = [
            "https://nanoapi.oss-ap-northeast-1.aliyuncs.com/u.json",
            "https://47.76.194.59/u.json",
            "http://47.76.194.59:8080/u.json",
          ]
          for url in urls:
              print("PROBE", url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/json"}, method="GET")
                  with urllib.request.urlopen(req, timeout=12, context=ssl.create_default_context()) as resp:
                      b = resp.read(100000)
                      print("STATUS", resp.status, "LENGTH", len(b), "CONTENT_TYPE", resp.headers.get("Content-Type"),flush=True)
                      try:
                          data=json.loads(b)
                          print("JSON_TYPE",type(data).__name__,"KEYS",list(data)[:15] if isinstance(data,dict) else "", flush=True)
                          if isinstance(data,dict):
                              for k in ["url","api","api_url","base_url","apiBaseUrl"]:
                                  if isinstance(data.get(k),str):
                                      parsed=urllib.parse.urlsplit(data[k])
                                      print("CONFIG_URL",k,parsed.scheme,parsed.hostname,parsed.path,flush=True)
                      except (ValueError,UnicodeDecodeError):
                          print("NOT_JSON",flush=True)
              except Exception as exc:
                  print("ERROR",type(exc).__name__,str(exc)[:190],flush=True)
          print("=== PUBLIC API ENDPOINTS (NO CREDENTIALS) ===",flush=True)
          api="https://account.alibaba.alicdn.men/api/v1"
          probes=[
            (api, "python-urllib"),
            (api+"/passport/auth/login", "python-urllib"),
            (api+"/user/checkinStatus", "python-urllib"),
            (api+"/user/checkinStatus", "Dart/3.7 (dart:io)"),
            (api+"/user/info", "Dart/3.7 (dart:io)"),
            (api+"/user/checkinStatus", "Dart/3.11 (dart:io)"),
            (api+"/user/checkinStatus", "Dart/3.11.5 (dart:io)"),
          ]
          for url,ua in probes:
              print("API_PROBE",url,"UA",ua,flush=True)
              try:
                  req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":ua},method="GET")
                  with urllib.request.urlopen(req,timeout=12,context=ssl.create_default_context()) as resp:
                      b=resp.read(256)
                      print("API_RESULT",resp.status,"LEN_UP_TO_256",len(b),"CT",resp.headers.get("Content-Type"),"CL",resp.headers.get("Content-Length"),"SERVER",resp.headers.get("Server"),"DATE",resp.headers.get("Date"),flush=True)
              except urllib.error.HTTPError as exc:
                  print("API_HTTPERROR",exc.code,"CT",exc.headers.get("Content-Type"),"CL",exc.headers.get("Content-Length"),flush=True)
              except Exception as exc:
                  print("API_ERROR",type(exc).__name__,str(exc)[:120],flush=True)
          print("=== PUBLIC LOGIN VALIDATION (NO ACCOUNT / PASSWORD) ===",flush=True)
          tests=[
            ("GET", api+"/guest/comm/config", None),
            ("POST", api+"/passport/auth/login", b"{}"),
          ]
          for method,url,payload in tests:
              print("LOGIN_PROBE", method,url,flush=True)
              try:
                  req=urllib.request.Request(url,data=payload,headers={
                      "Accept":"application/json",
                      "User-Agent":"Dart/3.11 (dart:io)",
                      "Content-Type":"application/json"
                  },method=method)
                  try:
                      response=urllib.request.urlopen(req,timeout=12,context=ssl.create_default_context())
                  except urllib.error.HTTPError as e:
                      response=e
                  with response:
                      raw=response.read(4096)
                      print("LOGIN_RESULT",response.status,"CT",response.headers.get("Content-Type"),"LEN",len(raw),flush=True)
                      try:
                          body=json.loads(raw)
                          if isinstance(body,dict):
                              print("LOGIN_JSON_KEYS",list(body.keys())[:12],flush=True)
                              print("LOGIN_JSON_CODE",str(body.get("code",""))[:90],flush=True)
                              msg=body.get("message")
                              if isinstance(msg,str):
                                  print("LOGIN_JSON_MESSAGE",msg[:200],flush=True)
                              data=body.get("data")
                              if isinstance(data,dict):
                                  print("LOGIN_DATA_KEYS",list(data.keys())[:12],flush=True)
                                  print("LOGIN_AUTH_FLAGS", {k:data.get(k) for k in ("is_recaptcha","is_pow","pow_difficulty","is_email_verify")},flush=True)
                          else: print("LOGIN_JSON_TYPE",type(body).__name__,flush=True)
                      except (ValueError,UnicodeDecodeError):
                          print("LOGIN_BODY_TYPE", "HTML" if raw.lstrip().startswith(b"<") else "nonjson",flush=True)
              except Exception as exc:
                  print("LOGIN_ERROR",type(exc).__name__,str(exc)[:120],flush=True)
          PY
