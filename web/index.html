<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nano 每日签到</title><style>
:root{font-family:system-ui,sans-serif;color:#e6edf3;background:#101827}body{max-width:960px;margin:40px auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}.card,section{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px}.value{font-size:26px;margin-top:12px}button{cursor:pointer;background:#52e0b4;color:#102220;font-weight:700;border:0;border-radius:8px;padding:12px 18px}button:disabled{opacity:.5}input{background:#0f172a;border:1px solid #64748b;border-radius:8px;color:white;padding:12px;width:min(400px,75%)}p,small{color:#b5c4d8}table{width:100%;text-align:left;border-collapse:collapse}td,th{padding:14px 8px;border-bottom:1px solid #334155}#message{white-space:pre-wrap}a{color:#52e0b4}
</style><header><div><small>ASTRBOT · NAS</small><h1>Nano 每日签到</h1><p>定时任务、执行记录与消息推送状态</p></div><button id="refresh">刷新状态</button></header>
<section><label for="token">面板访问令牌（NANO_PANEL_TOKEN）</label><p><input id="token" type="password" autocomplete="off" placeholder="输入面板令牌"><button id="connect">连接</button></p><small>令牌仅保存在当前页面内存，刷新后需重新输入。请通过 HTTPS 反向代理访问。</small></section>
<div class="cards"><div class="card">计划时间<div class="value" id="schedule">—</div><small id="zone">—</small></div><div class="card">今日状态<div class="value" id="done">—</div></div><div class="card">今日尝试<div class="value" id="attempts">—</div></div><div class="card">待推送<div class="value" id="pending">—</div></div></div>
<section><h2>任务控制</h2><p id="enabled">尚未连接</p><button id="run">立即执行签到</button><p>每天最多尝试 3 次；自动重试间隔 15 分钟。已完成的任务不会重复提交。</p><p id="message" role="status"></p></section>
<section style="margin-top:20px"><h2>最近执行记录</h2><table><thead><tr><th>时间</th><th>结果</th><th>说明</th></tr></thead><tbody id="history"></tbody></table></section>
<script>
const $=id=>document.getElementById(id);let token='';
async function api(path,method='GET'){let r=await fetch(path,{method,headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status===401?'访问令牌无效':'请求失败：'+r.status);return r.json()}
async function refresh(){try{let s=await api('/api/status');$('schedule').textContent=s.daily_time;$('zone').textContent=s.timezone;$('done').textContent=s.done?'任务已完成':'等待 / 未完成';$('attempts').textContent=s.attempts;$('pending').textContent=s.pending.length;$('enabled').textContent=s.enabled?'定时任务已启用':'定时任务已关闭，请在 AstrBot 插件配置中启用';$('run').disabled=!s.enabled;$('history').replaceChildren();for(let row of [...s.history].reverse()){let tr=document.createElement('tr');for(let x of [row.time,row.outcome==='completed'?'完成':'失败',row.message]){let td=document.createElement('td');td.textContent=x;tr.append(td)}$('history').append(tr)}}catch(e){$('message').textContent=e.message}}
$('connect').onclick=()=>{token=$('token').value;$('token').value='';refresh()};$('refresh').onclick=refresh;$('run').onclick=async()=>{if(!confirm('现在向配置的 Nano 服务提交签到？'))return;$('run').disabled=true;try{$('message').textContent=(await api('/api/run','POST')).message}catch(e){$('message').textContent=e.message}await refresh()};
</script></html>
